name: Editorial RSS candidates

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: |
          python3 -m pip install --quiet certifi
          python3 scripts/fetch_editorial.py
      - name: Commit candidates
        run: |
          git config user.name "editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial
          if git diff --staged --quiet; then
            echo "no candidate changes"
          else
            git commit -m "chore: refresh editorial candidates"
            git push
          fi
